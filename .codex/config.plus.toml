# Codex hybrid orchestrator configuration (Plus compatibility profile)
#
# This keeps the long-lived root thread on Luna at maximum reasoning to reduce
# rate-limit pressure. Named role files define behavior only; the orchestration skill
# may request Sol/Terra/Luna dynamically when the live spawn tool exposes them.
# Do not claim Astra-root orchestration under this profile.

model = "gpt-5.6-luna"
model_reasoning_effort = "max"

approval_policy = "on-request"
sandbox_mode = "workspace-write"

[agents]
enabled = true
max_concurrent_threads_per_session = 4

# Fallback only. Explicit routing by the skill takes precedence when supported.
default_subagent_model = "gpt-5.6-luna"
default_subagent_reasoning_effort = "medium"
