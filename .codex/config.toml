# Codex hybrid orchestrator configuration (Pro profile)
#
# Root architecture/acceptance stays on Astra. Named role files define behavior only;
# the astra-orchestrator skill selects each child model and reasoning effort dynamically.
# The [agents] defaults below are safe fallbacks for generic spawns that omit explicit routing.

model = "gpt-6-astra"
model_reasoning_effort = "low"

approval_policy = "on-request"
sandbox_mode = "workspace-write"

[agents]
enabled = true

# Hard safety ceiling. Increase only after measuring a workload that is genuinely parallel.
max_concurrent_threads_per_session = 4

# Fallback only. The orchestration skill normally requests model/effort explicitly.
default_subagent_model = "gpt-5.6-luna"
default_subagent_reasoning_effort = "medium"
