name: Verify hybrid orchestrator

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify configuration, role contracts, skill, and cost scenario
        run: python scripts/verify_repository.py
